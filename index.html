<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>随机迷宫</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 16px;
    background:
      radial-gradient(1000px 520px at 50% -10%, rgba(126, 82, 44, .45), transparent 70%),
      #241610;
    color: #f4e6d2;
    font-family: Georgia, "Songti SC", "SimSun", "PingFang SC", serif;
    -webkit-font-smoothing: antialiased;
  }

  .app { width: min(94vw, calc(100vh - 130px), 880px); }

  .topbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .toolbar .btn { margin-left: auto; }

  .seg {
    margin-left: auto;
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 11px;
    background: rgba(58, 36, 22, .75);
    border: 1px solid rgba(160, 118, 74, .28);
  }

  .seg-btn {
    border: 0;
    background: transparent;
    padding: 6px 11px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: #c6a887;
    cursor: pointer;
    transition: background .18s, color .18s;
  }

  .seg-btn:hover { color: #f4e3c8; background: rgba(255, 240, 220, .08); }

  .seg-btn.is-active {
    color: #2a1608;
    background: linear-gradient(180deg, #e8be86, #bb7f3e);
    box-shadow: 0 4px 12px -6px rgba(184, 121, 60, .9);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .08em;
    color: #ecd7b6;
    white-space: nowrap;
  }

  .brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d9a35f;
    box-shadow: 0 0 10px rgba(217, 163, 95, .7);
  }

  .stats {
    display: flex;
    gap: 8px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    line-height: 1.2;
    padding: 6px 12px;
    min-width: 76px;
    border-radius: 10px;
    background: rgba(58, 36, 22, .8);
    border: 1px solid rgba(160, 118, 74, .3);
    box-shadow: inset 0 1px 0 rgba(255, 238, 214, .1), 0 8px 18px -14px rgba(0, 0, 0, .95);
  }

  .stat .label {
    font-size: 10px;
    letter-spacing: .16em;
    color: #b08a63;
  }

  .stat .value {
    font-size: 15px;
    font-weight: 600;
    color: #f5c96b;
    font-variant-numeric: tabular-nums;
  }

  /* 步数：绿色 */
  #steps { color: #7edc9a; }

  .btn {
    border: 0;
    border-radius: 10px;
    padding: 10px 16px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #2a1608;
    background: linear-gradient(180deg, #e8be86, #c08a4c);
    box-shadow: 0 8px 20px -8px rgba(160, 110, 60, .85),
                inset 0 1px 0 rgba(255, 245, 225, .55),
                inset 0 -1px 0 rgba(60, 30, 10, .22);
    cursor: pointer;
    white-space: nowrap;
    transition: filter .18s, transform .12s;
  }

  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: translateY(1px); }

  /* 音效开关：小一号的次要按钮 */
  .sound {
    border: 1px solid rgba(160, 118, 74, .34);
    border-radius: 10px;
    padding: 9px 11px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    color: #c6a887;
    background: rgba(58, 36, 22, .75);
    cursor: pointer;
    white-space: nowrap;
    transition: color .18s, background .18s, border-color .18s;
  }

  .sound:hover { color: #f4e3c8; background: rgba(255, 240, 220, .08); }

  .sound[aria-pressed="false"] {
    color: #7f6647;
    border-color: rgba(160, 118, 74, .18);
  }

  .board {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    overflow: hidden;
    background: #062128;
    box-shadow:
      0 0 0 1px rgba(160, 118, 74, .35),
      0 0 0 6px rgba(58, 36, 22, .55),
      0 30px 60px -30px rgba(0, 0, 0, .95),
      inset 0 0 60px rgba(0, 0, 0, .35);
  }

  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(28, 16, 9, .5);
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    transition: opacity .28s ease;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .panel {
    text-align: center;
    cursor: default;
    padding: 26px 32px;
    border-radius: 16px;
    background: rgba(46, 28, 17, .96);
    border: 1px solid rgba(176, 132, 86, .38);
    box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .9);
    transform: translateY(10px) scale(.96);
    transition: transform .28s cubic-bezier(.2, .9, .3, 1.2);
  }

  .overlay.show .panel { transform: translateY(0) scale(1); }

  .panel h2 {
    margin: 0 0 8px;
    font-size: 26px;
    letter-spacing: .2em;
    text-indent: .2em;
    color: #f6e6cd;
    text-shadow: 0 0 24px rgba(230, 180, 120, .4);
  }

  .panel p {
    margin: 0 0 20px;
    font-size: 13px;
    color: #c0a184;
    font-variant-numeric: tabular-nums;
  }

  .hint {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    letter-spacing: .03em;
    color: #9a7b58;
  }

  /* 触屏方向按钮：默认隐藏，只在触屏设备上出现 */
  .dpad { display: none; }
  .hint-touch { display: none; }

  @media (pointer: coarse) {
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
    }
    .dpad .dbtn {
      padding: 0;
      height: 64px;
      font-size: 24px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: filter .14s ease, transform .14s ease;
    }
    .dpad .dbtn.is-pressed {
      filter: brightness(0.78);
      transform: scale(0.92);
    }
    .dpad .up    { grid-column: 2; grid-row: 1; }
    .dpad .left  { grid-column: 1; grid-row: 2; }
    .dpad .down  { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .hint-kbd   { display: none; }
    .hint-touch { display: block; }
  }

  @media (max-width: 430px) {
    .brand { font-size: 14px; }
    .stat { min-width: 62px; padding: 5px 9px; }
    .stat .value { font-size: 14px; }
    .btn { padding: 9px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>青蛙迷宫</div>
    <div class="seg" role="group" aria-label="迷宫尺寸">
      <button class="seg-btn" data-size="10" type="button">10×10</button>
      <button class="seg-btn is-active" data-size="15" type="button">15×15</button>
      <button class="seg-btn" data-size="20" type="button">20×20</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="stats">
      <div class="stat"><span class="label">步数</span><span class="value" id="steps">0</span></div>
      <div class="stat"><span class="label">最佳</span><span class="value" id="best">—</span></div>
      <div class="stat"><span class="label">用时</span><span class="value" id="time">00:00.0</span></div>
    </div>
    <button class="sound" id="sound" type="button" aria-pressed="true">有声</button>
    <button class="btn" id="regen" type="button">重新生成</button>
  </div>

  <div class="board" id="board">
    <canvas id="maze"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h2>通关</h2>
        <p id="result"></p>
        <button class="btn" id="again" type="button">再来一局</button>
      </div>
    </div>
  </div>

  <div class="dpad" id="dpad" aria-label="方向控制">
    <button class="btn dbtn up" type="button" data-dir="0,-1" aria-label="上">↑</button>
    <button class="btn dbtn left" type="button" data-dir="-1,0" aria-label="左">←</button>
    <button class="btn dbtn down" type="button" data-dir="0,1" aria-label="下">↓</button>
    <button class="btn dbtn right" type="button" data-dir="1,0" aria-label="右">→</button>
  </div>

  <div class="hint hint-kbd">方向键 或 W A S D 移动 · 吃掉小飞虫减 3 秒 · 从左上洞穴钻到右下出口</div>
  <div class="hint hint-touch">点下方方向按钮移动 · 从左上角出发，抵达右下角</div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- 配置 ---------- */
  var N = 15;                 // 迷宫边长（格），可切换 10 / 15 / 20
  var TOP = 1, RIGHT = 2, BOTTOM = 4, LEFT = 8;  // 四面墙的位标记

  /* ---------- DOM ---------- */
  var boardEl   = document.getElementById('board');
  var canvas    = document.getElementById('maze');
  var ctx       = canvas.getContext('2d');

  // 静态层（地面 + 墙）缓存，只在尺寸变化时重画一次
  var bgCanvas  = document.createElement('canvas');
  var bgCtx     = bgCanvas.getContext('2d');
  var stepsEl   = document.getElementById('steps');
  var bestEl    = document.getElementById('best');
  var timeEl    = document.getElementById('time');
  var overlayEl = document.getElementById('overlay');
  var resultEl  = document.getElementById('result');

  /* ---------- 状态 ---------- */
  var walls = null;           // Uint8Array(N*N)，每一位代表一面墙
  var px = 0, py = 0;         // 小人格子坐标
  var steps = 0;
  var cellPx = 20;            // 每格边长（CSS 像素）
  var timerOn = false;        // 计时是否在跑
  var t0 = 0;                 // 本次计时起点
  var accumMs = 0;            // 已累计毫秒
  var won = false;
  var path = [];              // 走过的格子坐标，用于通关后画轨迹
  var bugs = [];              // 小飞虫：{ x, y, ph }
  var bonusMs = 0;            // 吃掉飞虫累计减掉的用时
  var splashAt = -1;          // 跃入水中特效开始时间，-1 表示没有
  var toastText = '';         // 吃到飞虫时冒出的提示文字
  var toastAt = -1;           // 提示文字出现时间
  var dir = 1;                // 小青蛙朝向：1 朝右，-1 朝左
  var renderX = 0, renderY = 0;  // 小青蛙实际显示位置（浮点）
  var lastMoveAt = 0;            // 上次移动时间，用于判断是否在动
  var jumpFromX = 0, jumpFromY = 0;  // 本次跳跃的起点（显示坐标）
  var jumpStartAt = -1;          // 本次跳跃开始时间，-1 表示没在跳
  var jumpT = 1;                 // 跳跃进度 0→1
  var airT = 0;                  // 腾空系数 0→1→0，用于高度和拉伸
  var jumpCarry = 0;             // 被打断时的腾空系数，保证连跳不断档
  var lastKeyAt = 0;
  var lastTimeText = '';
  var mazeVersion = 0;        // 迷宫版本号：每次重新生成 +1
  var staticKey = '';         // 当前静态层对应的「尺寸|清晰度|难度|迷宫版本」

  /* ---------- 音效：用浏览器自带的合成器，不需要音频文件 ---------- */
  var soundOn = true;
  var actx = null;

  function audioCtx() {
    if (!actx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;            // 老浏览器不支持就安静跳过
      actx = new AC();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  // 吹一声：freq 起始频率，dur 时长（秒），type 音色，vol 音量，slideTo 滑到的频率
  function tone(freq, dur, type, vol, slideTo) {
    if (!soundOn) return;
    var a = audioCtx();
    if (!a) return;

    var o = a.createOscillator();
    var g = a.createGain();

    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) {
      o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    }

    // 快速淡入、缓慢淡出，避免"啪"的爆音
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.linearRampToValueAtTime(vol, a.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);

    o.connect(g);
    g.connect(a.destination);
    o.start();
    o.stop(a.currentTime + dur + 0.03);
  }

  // 通关：四个音符依次响起
  function winFanfare() {
    var notes = [523.25, 659.25, 783.99, 1046.5];
    for (var i = 0; i < notes.length; i++) {
      (function (f, delay) {
        window.setTimeout(function () { tone(f, 0.26, 'triangle', 0.06); }, delay);
      })(notes[i], i * 105);
    }
  }

  var soundBtn = document.getElementById('sound');

  function applySound(on) {
    soundOn = on;
    soundBtn.textContent = on ? '有声' : '无声';
    soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  try {
    applySound(window.localStorage.getItem('maze_sound_on') !== '0');
  } catch (e) { /* 读不了就保持默认有声 */ }

  soundBtn.addEventListener('click', function () {
    applySound(!soundOn);
    try {
      window.localStorage.setItem('maze_sound_on', soundOn ? '1' : '0');
    } catch (e) { /* 存不了不影响玩 */ }
    if (soundOn) tone(660, 0.1, 'sine', 0.05);   // 打开时给个应答
  });

  /* ---------- 最佳步数（按难度分别保存） ---------- */
  function bestKey() {
    return 'maze_best_steps_' + N;
  }

  function loadBest() {
    var v = null;
    try {
      var raw = window.localStorage.getItem(bestKey());
      var n = parseInt(raw, 10);
      v = isNaN(n) ? null : n;
    } catch (e) {
      v = null;              // 无痕模式或禁用存储时静默降级
    }
    bestEl.textContent = v === null ? '—' : String(v);
    return v;
  }

  function saveBest(v) {
    try {
      window.localStorage.setItem(bestKey(), String(v));
    } catch (e) { /* 存不了就算了，不影响玩 */ }
  }

  /* ---------- 迷宫生成：递归回溯 ---------- */
  function generateMaze() {
    mazeVersion++;              // 换迷宫了，静态层必须重建
    walls = new Uint8Array(N * N).fill(TOP | RIGHT | BOTTOM | LEFT);
    var visited = new Uint8Array(N * N);
    var stack = [0];
    visited[0] = 1;

    var dirs = [
      { dx: 0,  dy: -1, w: TOP,    opp: BOTTOM },
      { dx: 1,  dy: 0,  w: RIGHT,  opp: LEFT   },
      { dx: 0,  dy: 1,  w: BOTTOM, opp: TOP    },
      { dx: -1, dy: 0,  w: LEFT,   opp: RIGHT  }
    ];

    while (stack.length) {
      var cur = stack[stack.length - 1];
      var cx = cur % N, cy = (cur / N) | 0;
      var opts = [];

      for (var i = 0; i < 4; i++) {
        var d = dirs[i];
        var nx = cx + d.dx, ny = cy + d.dy;
        if (nx >= 0 && nx < N && ny >= 0 && ny < N) {
          var ni = ny * N + nx;
          if (!visited[ni]) opts.push({ idx: ni, d: d });
        }
      }

      if (opts.length === 0) { stack.pop(); continue; }

      var pick = opts[(Math.random() * opts.length) | 0];
      walls[cur] &= ~pick.d.w;        // 打通当前格
      walls[pick.idx] &= ~pick.d.opp; // 打通相邻格
      visited[pick.idx] = 1;
      stack.push(pick.idx);
    }
  }

  /* ---------- 小飞虫 ---------- */
  var BUG_BONUS_MS = 3000;      // 每吃掉一只，用时减 3 秒

  function spawnBugs() {
    var list = [];
    var want = Math.max(4, Math.round(N * N * 0.032));
    var guard = 0;

    while (list.length < want && guard < 600) {
      guard++;
      var idx = (Math.random() * N * N) | 0;
      var bx = idx % N;
      var by = (idx / N) | 0;

      if (bx === 0 && by === 0) continue;                 // 起点不放
      if (bx === N - 1 && by === N - 1) continue;         // 终点不放

      var dup = false;
      for (var i = 0; i < list.length; i++) {
        if (list[i].x === bx && list[i].y === by) { dup = true; break; }
      }
      if (dup) continue;

      list.push({ x: bx, y: by, ph: Math.random() * 6.283 });
    }
    return list;
  }

  /* ---------- 新开一局 ---------- */
  function newGame() {
    generateMaze();
    px = 0; py = 0;
    renderX = 0; renderY = 0;
    lastMoveAt = 0;
    jumpStartAt = -1;
    jumpT = 1;
    airT = 0;
    jumpCarry = 0;
    steps = 0;
    timerOn = false;
    t0 = 0;
    accumMs = 0;
    won = false;
    path = [[0, 0]];           // 轨迹从起点开始
    bugs = spawnBugs();        // 随机撒一把小飞虫
    bonusMs = 0;
    splashAt = -1;
    toastAt = -1;
    toastText = '';
    lastKeyAt = 0;
    lastTimeText = '';

    overlayEl.classList.remove('show');
    stepsEl.textContent = '0';
    timeEl.textContent = '00:00.0';
    loadBest();

    resize();
  }

  /* ---------- 移动 ---------- */
  function move(dx, dy) {
    if (won) return;

    if (!timerOn) {           // 第一次操作开始计时
      timerOn = true;
      t0 = performance.now();
    }

    var cur = py * N + px;
    var w = dx === 1 ? RIGHT : dx === -1 ? LEFT : dy === 1 ? BOTTOM : TOP;

    if (walls[cur] & w) {         // 撞墙，走不过去
      tone(110, 0.05, 'sine', 0.035);
      return;
    }

    px += dx;
    py += dy;
    steps++;
    if (dx !== 0) dir = dx;

    // 起跳：从当前显示位置跳向新格子
    jumpFromX = renderX;
    jumpFromY = renderY;
    jumpCarry = airT;           // 上一跳没落地就接下一跳时，保留腾空高度
    jumpStartAt = performance.now();
    lastMoveAt = jumpStartAt;

    path.push([px, py]);
    stepsEl.textContent = String(steps);

    tone(430 + Math.random() * 60, 0.07, 'triangle', 0.045, 620);   // 起跳的"呱"

    // 踩到小飞虫就一口吞掉，用时减 3 秒
    for (var b = 0; b < bugs.length; b++) {
      if (bugs[b].x === px && bugs[b].y === py) {
        bugs.splice(b, 1);
        bonusMs += BUG_BONUS_MS;
        toastText = '-' + (BUG_BONUS_MS / 1000) + 's';
        toastAt = performance.now();
        tone(1050, 0.14, 'square', 0.05, 1600);   // 咬到飞虫的"叮"
        break;
      }
    }

    if (px === N - 1 && py === N - 1) win();
  }

  function win() {
    won = true;
    // 只把真实跑表时间并进 accumMs；吃虫减时统一由 elapsed() 扣一次。
    // 原来 accumMs = elapsed() 已经扣过奖励，HUD 每帧再调 elapsed() 又扣一遍，
    // 通关后顶栏用时会比结算面板少 3 秒/只虫
    if (timerOn) {
      accumMs += performance.now() - t0;
      timerOn = false;
    }
    splashAt = performance.now();   // 触发跃入水中的水花

    var used = elapsed();
    var prevBest = loadBest();
    if (prevBest === null || steps < prevBest) {
      saveBest(steps);
      bestEl.textContent = String(steps);
      resultEl.textContent = '共 ' + steps + ' 步 · 新纪录！用时 ' + fmt(used);
    } else {
      resultEl.textContent = '共 ' + steps + ' 步 · 最佳 ' + prevBest + ' 步 · 用时 ' + fmt(used);
    }

    overlayEl.classList.add('show');
    winFanfare();
  }

  /* ---------- 计时 ---------- */
  function elapsed() {
    var raw = timerOn ? accumMs + (performance.now() - t0) : accumMs;
    return Math.max(0, raw - bonusMs);   // 吃飞虫减掉的时长
  }

  function fmt(ms) {
    var total = ms / 1000;
    var m = Math.floor(total / 60);
    var s = Math.floor(total % 60);
    var d = Math.floor(total * 10) % 10;
    return pad2(m) + ':' + pad2(s) + '.' + d;
  }

  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function updateClock() {
    var text = fmt(elapsed());
    if (text !== lastTimeText) {
      lastTimeText = text;
      timeEl.textContent = text;
    }
  }

  /* ---------- 尺寸自适应 ---------- */
  function resize() {
    if (!walls) return;
    var size = boardEl.clientWidth;
    if (size <= 0) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    // window.resize 和 ResizeObserver 会各触发一次；尺寸/清晰度/难度/迷宫都没变就不重建
    var key = size + '|' + dpr + '|' + N + '|' + mazeVersion;
    if (key === staticKey) return;
    staticKey = key;

    cellPx = size / N;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    buildStaticLayer(size, dpr);

    draw(performance.now());
  }

  /* ---------- 静态层：水塘底 + 水草围墙（只重绘一次） ---------- */
  function buildStaticLayer(size, dpr) {
    bgCanvas.width = Math.round(size * dpr);
    bgCanvas.height = Math.round(size * dpr);

    var c = bgCtx;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, size, size);

    var S = cellPx * N;

    // 水塘底：由浅到深的青绿渐变
    var base = c.createRadialGradient(S * 0.36, S * 0.28, S * 0.04, S * 0.5, S * 0.52, S * 0.95);
    base.addColorStop(0, '#15585c');
    base.addColorStop(0.5, '#0d3f47');
    base.addColorStop(1, '#062128');
    c.fillStyle = base;
    c.fillRect(0, 0, S, S);

    // 池底泥沙斑块：深浅不一，避免死板的纯色
    for (var bi = 0; bi < 26; bi++) {
      var bx = Math.random() * S;
      var by = Math.random() * S;
      var br = S * (0.03 + Math.random() * 0.08);
      var blob = c.createRadialGradient(bx, by, 0, bx, by, br);
      blob.addColorStop(0, Math.random() > 0.45
        ? 'rgba(3, 24, 26, .22)'
        : 'rgba(46, 108, 96, .16)');
      blob.addColorStop(1, 'rgba(0, 0, 0, 0)');
      c.fillStyle = blob;
      c.fillRect(bx - br, by - br, br * 2, br * 2);
    }

    // 水面透下来的光斑（焦散），用叠加模式提亮
    c.globalCompositeOperation = 'lighter';
    for (var ci = 0; ci < 9; ci++) {
      var lx = Math.random() * S;
      var ly = Math.random() * S;
      var lr = S * (0.06 + Math.random() * 0.1);
      var glow = c.createRadialGradient(lx, ly, 0, lx, ly, lr);
      glow.addColorStop(0, 'rgba(150, 235, 205, .085)');
      glow.addColorStop(1, 'rgba(150, 235, 205, 0)');
      c.fillStyle = glow;
      c.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
    }
    c.globalCompositeOperation = 'source-over';

    // 水面波纹：一层层很淡的横向波线
    for (var wi = 0; wi < 16; wi++) {
      var wy = (wi + 0.5) * (S / 16) + (Math.random() - 0.5) * S * 0.04;
      var amp = S * (0.002 + Math.random() * 0.006);
      c.beginPath();
      c.moveTo(0, wy);
      for (var wx = 0; wx < S; wx += S / 14) {
        var nx = Math.min(S, wx + S / 14);
        var lift = (Math.floor(wx / (S / 14)) % 2 === 0) ? amp : -amp;
        c.quadraticCurveTo(wx + S / 28, wy + lift, nx, wy);
      }
      c.strokeStyle = 'rgba(190, 245, 230, .035)';
      c.lineWidth = 1;
      c.stroke();
    }

    // 极淡棋盘格，帮助感知格子
    c.fillStyle = 'rgba(180, 240, 220, .022)';
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if ((x + y) % 2 === 0) c.fillRect(x * cellPx, y * cellPx, cellPx, cellPx);
      }
    }

    // 收集所有墙段（只取上 + 左，右侧和下侧边框单独补，避免重复绘制）
    var lw = Math.max(1.8, Math.min(cellPx * 0.14, 6));
    var segs = [];
    for (var gy = 0; gy < N; gy++) {
      for (var gx = 0; gx < N; gx++) {
        var wb = walls[gy * N + gx];
        var x0 = gx * cellPx, y0 = gy * cellPx;
        var x1 = x0 + cellPx, y1 = y0 + cellPx;
        if (wb & TOP)  segs.push([x0, y0, x1, y0]);
        if (wb & LEFT) segs.push([x0, y0, x0, y1]);
        if (gx === N - 1 && (wb & RIGHT))  segs.push([x1, y0, x1, y1]);
        if (gy === N - 1 && (wb & BOTTOM)) segs.push([x0, y1, x1, y1]);
      }
    }

    c.beginPath();
    for (var si = 0; si < segs.length; si++) {
      c.moveTo(segs[si][0], segs[si][1]);
      c.lineTo(segs[si][2], segs[si][3]);
    }
    c.lineCap = 'round';
    c.lineJoin = 'round';

    // 1) 水下投影：让水草有一点厚度
    c.save();
    c.translate(0, lw * 0.55);
    c.lineWidth = lw * 1.25;
    c.strokeStyle = 'rgba(2, 18, 16, .5)';
    c.stroke();
    c.restore();

    // 2) 水草主体（深绿）
    c.save();
    c.lineWidth = lw;
    c.strokeStyle = '#2f6b3c';
    c.shadowColor = 'rgba(3, 30, 20, .55)';
    c.shadowBlur = lw * 1.6;
    c.stroke();
    c.restore();

    // 3) 受光面：偏亮的草绿
    c.save();
    c.translate(0, -lw * 0.3);
    c.lineWidth = Math.max(1, lw * 0.34);
    c.strokeStyle = 'rgba(139, 205, 122, .55)';
    c.stroke();
    c.restore();

    // 4) 沿墙长出来的叶片：按线段等距撒点，左右交替伸出
    var LEAF = ['#3f8a4c', '#4e9d58', '#2f7239', '#63b06a'];
    var leafSize = Math.max(1.8, Math.min(lw * 0.72, 4.2));

    for (var li = 0; li < segs.length; li++) {
      var sx = segs[li][0], sy = segs[li][1];
      var ex = segs[li][2], ey = segs[li][3];
      var segLen = Math.sqrt((ex - sx) * (ex - sx) + (ey - sy) * (ey - sy));
      var ang = Math.atan2(ey - sy, ex - sx);
      var count = Math.max(1, Math.round(segLen / (lw * 3)));

      for (var li2 = 1; li2 <= count; li2++) {
        var t = li2 / (count + 1);
        var lpx = sx + (ex - sx) * t;
        var lpy = sy + (ey - sy) * t;
        var side = (li + li2) % 2 === 0 ? 1 : -1;
        var spread = (0.55 + Math.random() * 0.55) * side;

        c.save();
        c.translate(lpx, lpy);
        c.rotate(ang + spread * Math.PI * 0.5);
        c.beginPath();
        c.ellipse(leafSize * 0.7, 0, leafSize, leafSize * 0.42, 0, 0, Math.PI * 2);
        c.fillStyle = LEAF[(Math.random() * LEAF.length) | 0];
        c.globalAlpha = 0.75 + Math.random() * 0.25;
        c.fill();
        c.restore();
      }
    }
    c.globalAlpha = 1;
  }

  /* ---------- 绘制 ---------- */
  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function draw(ts) {
    if (!walls) return;

    var S = cellPx * N;
    ctx.clearRect(0, 0, S, S);

    // 贴静态层（地面 + 墙）
    if (bgCanvas.width > 0) ctx.drawImage(bgCanvas, 0, 0, S, S);

    // 终点：透光的洞穴出口
    var pulse = 0.5 + 0.5 * Math.sin(ts / 420);
    var ex = (N - 1) * cellPx + cellPx / 2;
    var ey = (N - 1) * cellPx + cellPx / 2;

    var halo = ctx.createRadialGradient(ex, ey, cellPx * 0.05, ex, ey, cellPx * 0.95);
    halo.addColorStop(0, 'rgba(140, 240, 215, ' + (0.26 + 0.14 * pulse).toFixed(3) + ')');
    halo.addColorStop(1, 'rgba(140, 240, 215, 0)');
    ctx.fillStyle = halo;
    ctx.fillRect(ex - cellPx, ey - cellPx, cellPx * 2, cellPx * 2);

    // 洞口外围的岩石
    ctx.beginPath();
    ctx.ellipse(ex, ey, cellPx * 0.37, cellPx * 0.34, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#27463f';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 190, 168, .35)';
    ctx.lineWidth = Math.max(1, cellPx * 0.035);
    ctx.stroke();

    // 洞里透出来的光
    var hole = ctx.createRadialGradient(ex, ey - cellPx * 0.03, cellPx * 0.02,
                                        ex, ey, cellPx * 0.3);
    hole.addColorStop(0, 'rgba(215, 255, 245, ' + (0.7 + 0.22 * pulse).toFixed(3) + ')');
    hole.addColorStop(0.55, 'rgba(96, 205, 180, .6)');
    hole.addColorStop(1, 'rgba(12, 52, 52, .92)');
    ctx.fillStyle = hole;
    ctx.beginPath();
    ctx.ellipse(ex, ey, cellPx * 0.28, cellPx * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // 起点：幽深的洞穴入口
    var sx = cellPx / 2, sy = cellPx / 2;

    ctx.beginPath();
    ctx.ellipse(sx, sy, cellPx * 0.37, cellPx * 0.34, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#27463f';
    ctx.fill();
    ctx.strokeStyle = 'rgba(120, 190, 168, .28)';
    ctx.lineWidth = Math.max(1, cellPx * 0.035);
    ctx.stroke();

    var shole = ctx.createRadialGradient(sx, sy - cellPx * 0.04, cellPx * 0.02,
                                         sx, sy, cellPx * 0.29);
    shole.addColorStop(0, 'rgba(2, 10, 12, .96)');
    shole.addColorStop(0.65, 'rgba(8, 30, 32, .92)');
    shole.addColorStop(1, 'rgba(38, 78, 70, .85)');
    ctx.fillStyle = shole;
    ctx.beginPath();
    ctx.ellipse(sx, sy, cellPx * 0.28, cellPx * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // 通关后：把走过的轨迹连成一条发光线
    if (won && path.length > 1) {
      ctx.save();
      ctx.beginPath();
      for (var pi = 0; pi < path.length; pi++) {
        var tx = path[pi][0] * cellPx + cellPx / 2;
        var ty = path[pi][1] * cellPx + cellPx / 2;
        if (pi === 0) ctx.moveTo(tx, ty);
        else ctx.lineTo(tx, ty);
      }
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // 外层柔光
      ctx.lineWidth = Math.max(3, cellPx * 0.24);
      ctx.strokeStyle = 'rgba(255, 216, 150, .22)';
      ctx.shadowColor = 'rgba(255, 200, 120, .5)';
      ctx.shadowBlur = cellPx * 0.8;
      ctx.stroke();

      // 内层亮线
      ctx.lineWidth = Math.max(1.2, cellPx * 0.09);
      ctx.strokeStyle = 'rgba(255, 244, 214, .92)';
      ctx.shadowBlur = 0;
      ctx.stroke();

      ctx.restore();
    }

    // 小青蛙：卡通风格 + 跳跃动画
    var r = cellPx * 0.54;      // 0.72 × 0.75，即上一版的 0.75 倍
    var runPhase = ts / 85;
    var running = (ts - lastMoveAt) < 420;
    var float = Math.sin(ts / 300) * cellPx * 0.012;   // 待机轻微起伏
    var jumpLift = airT * cellPx * 0.42;               // 腾空高度

    var cx = renderX * cellPx + cellPx / 2;
    var cy = renderY * cellPx + cellPx / 2 + float - jumpLift;

    // 落地影：跳得越高，影子越小越淡
    var shadowK = 1 - airT * 0.4;
    ctx.fillStyle = 'rgba(0, 0, 0, ' + (0.34 - airT * 0.16).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(cx, renderY * cellPx + cellPx * 0.82,
                r * 0.8 * shadowK, r * 0.24 * shadowK, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    if (dir < 0) ctx.scale(-1, 1);
    // 腾空时身体上下拉长、左右收窄，像真的窜起来
    ctx.scale(1 - airT * 0.07, 1 + airT * 0.13);

    var legPhase = (running && airT < 0.25) ? Math.sin(runPhase) : 0;

    var SKIN = '#6fbf5c';        // 蛙皮绿
    var SKIN_DARK = '#4d9440';   // 深绿：后腿 / 前脚
    var BELLY = '#eaf7cd';       // 肚皮
    var INK = '#20361c';         // 瞳仁 / 嘴线
    var OUTLINE = 'rgba(38, 74, 32, .5)';

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 两条后腿（落地跑动时交替摆动，腾空时向后上方收起）
    ctx.fillStyle = SKIN_DARK;
    ctx.beginPath();
    ctx.ellipse(-r * 0.64 - legPhase * r * 0.1, r * 0.5 - airT * r * 0.18,
                r * 0.26, r * 0.32, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.64 + legPhase * r * 0.1, r * 0.5 - airT * r * 0.18,
                r * 0.26, r * 0.32, 0.3, 0, Math.PI * 2);
    ctx.fill();

    // 圆胖身体
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.ellipse(0, r * 0.2, r * 0.74, r * 0.58, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = Math.max(1, r * 0.05);
    ctx.stroke();

    // 浅色肚皮
    ctx.fillStyle = BELLY;
    ctx.beginPath();
    ctx.ellipse(0, r * 0.36, r * 0.4, r * 0.33, 0, 0, Math.PI * 2);
    ctx.fill();

    // 两只前脚
    ctx.fillStyle = SKIN_DARK;
    ctx.beginPath();
    ctx.ellipse(-r * 0.34, r * 0.66, r * 0.18, r * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.34, r * 0.66, r * 0.18, r * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // 头顶两个凸起的大眼包
    ctx.fillStyle = SKIN;
    ctx.beginPath();
    ctx.arc(-r * 0.42, -r * 0.42, r * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = Math.max(1, r * 0.05);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(r * 0.42, -r * 0.42, r * 0.32, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 眼白
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-r * 0.42, -r * 0.44, r * 0.23, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.42, -r * 0.44, r * 0.23, 0, Math.PI * 2);
    ctx.fill();

    // 瞳仁
    ctx.fillStyle = INK;
    ctx.beginPath();
    ctx.arc(-r * 0.44, -r * 0.42, r * 0.11, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.4, -r * 0.42, r * 0.11, 0, Math.PI * 2);
    ctx.fill();

    // 眼睛高光
    ctx.fillStyle = 'rgba(255, 255, 255, .95)';
    ctx.beginPath();
    ctx.arc(-r * 0.47, -r * 0.47, r * 0.045, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r * 0.37, -r * 0.47, r * 0.045, 0, Math.PI * 2);
    ctx.fill();

    // 宽宽的笑嘴
    ctx.strokeStyle = INK;
    ctx.lineWidth = Math.max(1.2, r * 0.07);
    ctx.beginPath();
    ctx.arc(0, r * 0.02, r * 0.46, Math.PI * 0.18, Math.PI * 0.82);
    ctx.stroke();

    // 腮红
    ctx.fillStyle = 'rgba(255, 150, 150, .32)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.58, r * 0.1, r * 0.14, r * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(r * 0.58, r * 0.1, r * 0.14, r * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();

    // 脚下的尘土（只在贴地时出现）
    if (running && airT < 0.3) {
      var dust = 0.16 + 0.14 * Math.abs(Math.sin(runPhase));
      ctx.fillStyle = 'rgba(175, 225, 215, ' + dust.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(-r * 0.8, r * 0.8, r * 0.11, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-r * 1.0, r * 0.72, r * 0.075, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    // 小飞虫
    drawBugs(ts);

    // 跃入水中的水花
    drawSplash(ts);

    // 吃到飞虫的飘字
    drawToast(ts);
  }

  /* ---------- 小飞虫 ---------- */
  function drawBugs(ts) {
    for (var i = 0; i < bugs.length; i++) {
      var b = bugs[i];
      var size = Math.max(2, cellPx * 0.12);
      var bx = b.x * cellPx + cellPx / 2 + Math.cos(ts / 260 + b.ph) * cellPx * 0.1;
      var by = b.y * cellPx + cellPx / 2 + Math.sin(ts / 320 + b.ph) * cellPx * 0.09;
      var flap = Math.abs(Math.sin(ts / 45 + b.ph));

      // 周身柔光
      var gl = ctx.createRadialGradient(bx, by, 0, bx, by, size * 2.6);
      gl.addColorStop(0, 'rgba(255, 226, 140, .28)');
      gl.addColorStop(1, 'rgba(255, 226, 140, 0)');
      ctx.fillStyle = gl;
      ctx.fillRect(bx - size * 2.6, by - size * 2.6, size * 5.2, size * 5.2);

      // 翅膀（快速扇动）
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#e8fbff';
      ctx.beginPath();
      ctx.ellipse(bx - size * 0.5, by - size * 0.55,
                  size * 0.55, size * 0.28 * (0.4 + 0.6 * flap), -0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(bx + size * 0.5, by - size * 0.55,
                  size * 0.55, size * 0.28 * (0.4 + 0.6 * flap), 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 身体
      ctx.fillStyle = '#ffd76a';
      ctx.beginPath();
      ctx.ellipse(bx, by, size * 0.5, size * 0.72, 0, 0, Math.PI * 2);
      ctx.fill();

      // 头
      ctx.fillStyle = '#3a3320';
      ctx.beginPath();
      ctx.arc(bx, by - size * 0.75, size * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------- 跃入水中的水花 ---------- */
  function drawSplash(ts) {
    if (splashAt < 0) return;
    var t = (ts - splashAt) / 900;
    if (t > 1) return;

    var cx = (N - 1) * cellPx + cellPx / 2;
    var cy = (N - 1) * cellPx + cellPx / 2;

    // 一圈圈扩散的涟漪
    for (var i = 0; i < 3; i++) {
      var tt = t - i * 0.13;
      if (tt <= 0 || tt >= 1) continue;
      var rr = cellPx * (0.12 + tt * 0.8);
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(200, 255, 244, ' + ((1 - tt) * 0.55).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, cellPx * 0.05 * (1 - tt));
      ctx.stroke();
    }

    // 溅起的水珠
    for (var d = 0; d < 12; d++) {
      var ang = (d / 12) * Math.PI * 2 + 0.4;
      var reach = cellPx * (0.35 + (d % 4) * 0.1);
      var dx = cx + Math.cos(ang) * reach * t;
      var dy = cy + Math.sin(ang) * reach * t * 0.7 - cellPx * 0.55 * Math.sin(Math.PI * t);
      var rad = Math.max(0.8, cellPx * 0.05 * (1 - t));
      ctx.fillStyle = 'rgba(215, 255, 248, ' + ((1 - t) * 0.85).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(dx, dy, rad, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------- 吃掉飞虫的飘字 ---------- */
  function drawToast(ts) {
    if (toastAt < 0) return;
    var age = ts - toastAt;
    if (age > 900) return;

    ctx.save();
    ctx.globalAlpha = 1 - age / 900;
    ctx.fillStyle = '#b6ffd2';
    ctx.font = '700 ' + Math.max(11, cellPx * 0.34) +
               'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(60, 255, 150, .8)';
    ctx.shadowBlur = 8;
    ctx.fillText(toastText,
                 renderX * cellPx + cellPx / 2,
                 renderY * cellPx + cellPx / 2 - cellPx * 0.8 - age * 0.035);
    ctx.restore();
  }

  /* ---------- 主循环 ---------- */
  var JUMP_MS = 140;            // 一次跳跃的时长

  function updateJump(ts) {
    if (jumpStartAt < 0) return;

    jumpT = Math.min(1, (ts - jumpStartAt) / JUMP_MS);

    // 水平方向匀速靠近目标格，竖直方向走正弦弧线
    renderX = jumpFromX + (px - jumpFromX) * jumpT;
    renderY = jumpFromY + (py - jumpFromY) * jumpT;
    airT = Math.max(jumpCarry * (1 - jumpT), Math.sin(Math.PI * jumpT));

    if (jumpT >= 1) {           // 落地
      jumpStartAt = -1;
      airT = 0;
      jumpCarry = 0;
      renderX = px;
      renderY = py;
    }
  }

  function loop(ts) {
    updateJump(ts);
    draw(ts);
    updateClock();
    requestAnimationFrame(loop);
  }

  /* ---------- 键盘 ---------- */
  var KEY_DIRS = {
    arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
  };

  window.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    var dir = KEY_DIRS[e.key.toLowerCase()];
    if (!dir) return;

    e.preventDefault();                 // 阻止方向键滚动页面

    var now = performance.now();
    if (now - lastKeyAt < 60) return;   // 长按防飞键
    lastKeyAt = now;

    move(dir[0], dir[1]);
  }, { passive: false });

  /* ---------- 触屏方向按钮（复用键盘的 move 逻辑） ---------- */
  var dpadBtns = document.querySelectorAll('.dbtn');
  for (var b = 0; b < dpadBtns.length; b++) {
    dpadBtns[b].addEventListener('pointerdown', function (e) {
      e.preventDefault();               // 阻止滚动、双击缩放和多余点击
      this.classList.add('is-pressed');
      var dir = this.getAttribute('data-dir').split(',');
      move(Number(dir[0]), Number(dir[1]));
    });
    dpadBtns[b].addEventListener('pointerup', function () {
      this.classList.remove('is-pressed');
    });
    dpadBtns[b].addEventListener('pointercancel', function () {
      this.classList.remove('is-pressed');
    });
    dpadBtns[b].addEventListener('pointerleave', function () {
      this.classList.remove('is-pressed');
    });
  }

  /* ---------- 按钮 ---------- */
  document.getElementById('regen').addEventListener('click', newGame);
  document.getElementById('again').addEventListener('click', newGame);

  // 点一下遮罩空白处可收起面板，方便看完整轨迹
  overlayEl.addEventListener('click', function (e) {
    if (e.target === overlayEl) overlayEl.classList.remove('show');
  });

  /* ---------- 难度切换 ---------- */
  var sizeBtns = document.querySelectorAll('.seg-btn');

  for (var k = 0; k < sizeBtns.length; k++) {
    sizeBtns[k].addEventListener('click', function () {
      var next = Number(this.getAttribute('data-size'));
      if (next === N) return;          // 点当前难度不重开，避免误丢进度

      N = next;
      for (var m = 0; m < sizeBtns.length; m++) {
        sizeBtns[m].classList.toggle('is-active', sizeBtns[m] === this);
      }
      newGame();
    });
  }

  /* ---------- 启动 ---------- */
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(boardEl);

  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
